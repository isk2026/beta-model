name: Update & Deploy

on:
  schedule:
    # GitHub 예약 실행은 정각·30분에 몰려 수십 분~수 시간 늦거나 아예 빠질 수 있다 (2026-10 실제로 누락).
    # → 혼잡한 정각/30분을 피하고, 같은 장마감에 2~3번 실행해 하나가 빠져도 갱신되게 한다.
    #   같은 기준일 재실행은 기록을 덮어쓰고 알림은 처음 한 번만(신호가 바뀌면 정정) 보내므로 중복 알림은 없다.
    - cron: "47 7 * * 1-5"   # 16:47 KST — 한국장 마감(15:30) 후
    - cron: "23 8 * * 1-5"   # 17:23 KST — 예비
    - cron: "41 9 * * 1-5"   # 18:41 KST — 예비
    - cron: "13 22 * * 1-5"  # 07:13 KST — 미국장 마감(05:00/06:00 KST) 후
    - cron: "7 23 * * 1-5"   # 08:07 KST — 예비
    - cron: "17 23 * * 6"    # 일 08:17 KST — 주간 견고성 검증 + 주간 요약
  workflow_dispatch:
    inputs:
      weekly_summary:
        description: "텔레그램 주간 요약도 보내기"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["dashboard/public/data/**", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: update-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # 인증키는 저장소 Settings → Secrets and variables → Actions 에 등록 (없으면 자동으로 대체값 사용)
      - name: Update VKOSPI (KRX)
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python -m beta_model.kr_sources --update-vkospi
      - name: Fetch data & score
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python -m beta_model.export --refresh
      - name: Backtest (1990~)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python -m beta_model.backtest
      - name: Robustness validation (weekly / manual)
        if: github.event.schedule == '17 23 * * 6' || github.event_name == 'workflow_dispatch'
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python -m beta_model.validation

      # 국면 전환·매매 신호가 있으면 data/alert.md(Issue용 마크다운) + data/alert_telegram.html(텔레그램용) 이 생긴다.
      # Issue → 저장소 Watch 시 메일·앱 푸시. 텔레그램은 시크릿이 없으면 건너뛰고, 실패해도 워크플로는 계속.
      - name: Alert
        if: hashFiles('data/alert.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          gh issue create --title "Beta Model 신호 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST" --body-file data/alert.md || true
          python -m beta_model.notify send data/alert_telegram.html || true

      # 일요일 08:00 KST: 시장별 국면·비중·주간 신호·주도 섹터 요약 (텔레그램 전용, Issue 없음)
      - name: Weekly summary (Telegram)
        if: github.event.schedule == '17 23 * * 6' || inputs.weekly_summary
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m beta_model.notify weekly || true

      # 결과를 커밋해 두면 일별 모델 기록이 남고, 저장소가 활동 상태로 유지되어
      # 60일 무활동 시 예약 워크플로가 꺼지는 것도 막는다.
      - name: Commit latest scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/data/beta_model.json dashboard/public/data/backtest.json data/signal_log.csv
          if [ -f dashboard/public/data/validation.json ]; then git add dashboard/public/data/validation.json; fi
          if [ -f data/vkospi.csv ]; then git add data/vkospi.csv; fi
          if [ -f data/sector_leaders.json ]; then git add data/sector_leaders.json; fi
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC update"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci && npm run build
        working-directory: dashboard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
